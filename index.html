<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Scrolling Message Log</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #333;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 6px;
    }

    p {
      color: #666;
      margin-top: 0;
    }

    /* Fixed-height container configured to scroll automatically */
    #log-output {
      height: 500px;
      width: 1000px;
      overflow-y: auto;
      background-color: #1e1e1e;
      color: #38ef7d;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.95em;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
      white-space: pre-wrap;
      word-break: break-word;
      box-sizing: border-box;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      font-size: 0.95em;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 8px 16px;
      font-size: 0.95em;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>

  <h1>Auto-Scrolling Message Log</h1>

  <!-- Single element receiving all message outputs -->
  <div id="log-output"></div>

  <!-- Interactive input to demonstrate appending messages -->
  <div class="controls">
    <input type="text" id="message-input" placeholder="Type a message and press Enter..." />
    <button id="send-btn">Append Message</button>
  </div>

  <!-- Defer ensures the DOM is loaded before script.js runs -->
  <script src="script.js" defer></script>
</body>
</html>
